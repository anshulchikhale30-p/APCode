# WinGet manifest template for APCode
# This is a merged single-file manifest (WinGet schema 1.6+ supports merged).
# For submission, you can also split into multiple files under manifests/a/APCode/APCode/0.1.0/
# Do NOT invent SHA256 hashes — replace REPLACE_WITH_SHA256_* after a real GitHub release.
# See docs/packaging/winget.md for instructions.

PackageIdentifier: APCode.APCode
PackageVersion: 0.1.0
PackageLocale: en-US
Publisher: APCode
PublisherUrl: https://github.com/anshulchikhale30-p/APCode
PackageName: APCode
PackageUrl: https://github.com/anshulchikhale30-p/APCode
ShortDescription: Offline-first AI coding agent that adapts to your laptop
Description: |
  APCode is an offline-first AI coding agent you install in your terminal.
  It understands your hardware, recommends the right local model, and runs
  100% offline — no cloud APIs, no data leaving your machine.
  Features: hardware detection, benchmarking, model recommendation,
  local model management, offline code search, and local inference via
  native/llama.cpp/ollama runtimes.
Moniker: apcode
Tags:
  - ai
  - coding-agent
  - offline
  - llm
  - terminal
License: MIT
LicenseUrl: https://github.com/anshulchikhale30-p/APCode/blob/main/LICENSE
Copyright: Copyright (c) 2026 APCode
CopyrightUrl: https://github.com/anshulchikhale30-p/APCode/blob/main/LICENSE
ReleaseNotes: https://github.com/anshulchikhale30-p/APCode/releases/tag/v0.1.0
ReleaseNotesUrl: https://github.com/anshulchikhale30-p/APCode/releases/tag/v0.1.0
InstallationNotes: |
  APCode is added to PATH as `apcode`. Restart your terminal or run:
  $env:Path += ";$env:USERPROFILE\.apcode\bin"
  Then: apcode --version, apcode --help, apcode recommend
Documentations:
